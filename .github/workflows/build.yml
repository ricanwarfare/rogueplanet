name: Build RoguePlanet

on:
  push:
    branches: [server, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          cl /EHsc /std:c++17 /O2 /DNDEBUG RoguePlanet.cpp /link kernel32.lib bcrypt.lib taskschd.lib comsupp.lib virtdisk.lib ntdll.lib Rpcrt4.lib shlwapi.lib /OUT:RoguePlanet.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoguePlanet-exe
          path: RoguePlanet.exe
          retention-days: 30